<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>H-part debug viewer</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:sans-serif}
  #info{position:fixed;top:8px;left:8px;z-index:10;background:#000000aa;padding:8px 12px;border-radius:6px;font-size:13px;white-space:pre}
</style>
</head>
<body>
<div id="info">loading…</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const info = document.getElementById("info");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.001, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 2);
dl.position.set(2,3,2);
scene.add(dl);

const controls = new OrbitControls(camera, renderer.domElement);

const params = new URLSearchParams(location.search);
const file = params.get("f") || "H1";
const loader = new GLTFLoader();

let current = null;
function load(name) {
  if (current) scene.remove(current);
  info.textContent = "loading " + name + "...";
  loader.load(`./${name}.glb`, (gltf) => {
    current = gltf.scene;
    scene.add(current);
    const box = new THREE.Box3().setFromObject(current);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.copy(center).add(new THREE.Vector3(1,0.6,1).normalize().multiplyScalar(maxDim*1.6 + 0.01));
    camera.near = maxDim/1000; camera.far = maxDim*100; camera.updateProjectionMatrix();
    controls.target.copy(center);
    controls.update();
    let triCount = 0;
    current.traverse(o => { if (o.isMesh) triCount += o.geometry.index ? o.geometry.index.count/3 : o.geometry.attributes.position.count/3; });
    info.textContent = `${name}\nsize (m): ${size.x.toFixed(3)} x ${size.y.toFixed(3)} x ${size.z.toFixed(3)}\ntriangles: ${Math.round(triCount).toLocaleString()}\ndrag to orbit, scroll to zoom`;
  }, undefined, (err) => { info.textContent = "ERROR loading " + name + ": " + err.message; });
}
load(file);

window.loadPart = load;

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
